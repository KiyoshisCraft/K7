name: K7
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -oq k7-source.zip
      - name: Icone personalizado (se existir icone.png)
        run: |
          if [ -f icone.png ]; then
            IM=$(command -v magick || command -v convert)
            for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              mkdir -p app/src/main/res/mipmap-${d%%:*}
              $IM icone.png -resize ${d##*:}x${d##*:} app/src/main/res/mipmap-${d%%:*}/ic_launcher.png
            done
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug -PversionCode=${{ github.run_number }} --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk K7.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: K7 v${{ github.run_number }}
          files: K7.apk
